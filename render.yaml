# One-click deploy: https://render.com/deploy?repo=https://github.com/Uma-mahesh69/polampani
services:
  - type: web
    name: polampani
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
